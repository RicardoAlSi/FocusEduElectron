<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>FocusEdu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header" id="header">
    <h1>FocusEdu</h1>
  </header>

  <main class="main" id="main">
    <!-- Formulário: serve para cadastrar e editar -->
    <div class="menu-lateral" id="menu-lateral">
      <a href="#">Atividade</a>
    </div>

    <section id="secao-lista">
      <div class="navbar" id="navbar">
        <h2>Atividades e Projetos Escolares</h2>
        <ul>
          <li id="btn-concluir">Concluir/Reabrir</li>
          <li id="btn-editar">Editar</li>
          <li id="btn-excluir">Excluir</li>
          <li id="btn-adicionar">+ Nova Atividade</li>
        </ul>
      </div>

      <form id="formulario" class="formulario" hidden>
        <h3 id="titulo-formulario">Nova Atividade</h3>
        <label>Título
          <input type="text" id="campo-titulo" required>
        </label>
        <label>Disciplina
          <input type="text" id="campo-disciplina" required>
        </label>
        <label>Prazo
          <input type="date" id="campo-prazo" required>
        </label>
        <label>Descrição
          <textarea id="campo-descricao" rows="3"></textarea>
        </label>
        <div class="acoes-formulario">
          <button type="submit">Salvar</button>
          <button type="button" id="btn-cancelar">Cancelar</button>
        </div>
        
      </form>

      <ul id="lista"></ul>
    </section>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
